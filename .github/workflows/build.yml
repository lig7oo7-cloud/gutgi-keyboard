name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          cp app/build/outputs/apk/release/app-release.apk gutgi-keyboard.apk
          cp gifcap/build/outputs/apk/release/gifcap-release.apk emotion-gif-capture.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            gutgi-keyboard.apk
            emotion-gif-capture.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 굿기 키보드 v${{ github.run_number }}
          files: |
            gutgi-keyboard.apk
            emotion-gif-capture.apk
          make_latest: true
